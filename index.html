<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clientes Interlama</title>
<meta name="theme-color" content="#E30613">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clientes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
.top{padding-top:calc(12px + env(safe-area-inset-top,0px))!important;top:0!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: cabecera roja fija arriba, una pantalla cada vez, barra de 4 botones grandes fija abajo */
:root{
  --brand:#E30613; --brand-dk:#B5000E; --on-brand:#ffffff; --orange:#F39200; --orange-bg:#FDEFD9; --orange-fg:#8A4F00;
  --bg:#F4F2F1; --surface:#ffffff; --line:#DDD6D3; --fg:#1D1716; --muted:#655A57;
  --s-pend:#46586A; --s-pend-bg:#E5EBF1; --s-vis:#1D5FA8; --s-vis-bg:#E0ECF9;
  --s-int:#8F5300; --s-int-bg:#FCEDD2; --s-ped:#1C7339; --s-ped-bg:#DCF1E3;
  --s-desc:#77706D; --s-desc-bg:#ECE9E8; --wa:#1A8D4A;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#D0101C; --brand-dk:#A00010; --on-brand:#ffffff; --orange:#F7A73A; --orange-bg:#3A2A12; --orange-fg:#F7C27A;
  --bg:#161211; --surface:#221C1B; --line:#3B3331; --fg:#F3EEEC; --muted:#AFA4A0;
  --s-pend:#AFC0D2; --s-pend-bg:#26303A; --s-vis:#8DBBEE; --s-vis-bg:#1B2D42;
  --s-int:#F2BE6A; --s-int-bg:#3A2C14; --s-ped:#86D3A0; --s-ped-bg:#183324;
  --s-desc:#9C9592; --s-desc-bg:#2A2524; --wa:#4CC27E; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#D0101C; --brand-dk:#A00010; --on-brand:#ffffff; --orange:#F7A73A; --orange-bg:#3A2A12; --orange-fg:#F7C27A;
  --bg:#161211; --surface:#221C1B; --line:#3B3331; --fg:#F3EEEC; --muted:#AFA4A0;
  --s-pend:#AFC0D2; --s-pend-bg:#26303A; --s-vis:#8DBBEE; --s-vis-bg:#1B2D42;
  --s-int:#F2BE6A; --s-int-bg:#3A2C14; --s-ped:#86D3A0; --s-ped-bg:#183324;
  --s-desc:#9C9592; --s-desc-bg:#2A2524; --wa:#4CC27E; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:18px/1.45 var(--body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--brand);color:var(--on-brand);padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:68px}
.back{all:unset;cursor:pointer;display:flex;align-items:center;gap:4px;font:700 1rem var(--body);padding:10px 14px 10px 8px;border:2px solid rgba(255,255,255,.75);border-radius:12px;flex:0 0 auto}
.back svg{width:22px;height:22px}
.ttl{min-width:0;flex:1}
.gear{all:unset;cursor:pointer;flex:0 0 auto;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:2px solid rgba(255,255,255,.75)}
.gear svg{width:30px;height:30px}
.gear[hidden],.back[hidden]{display:none}
.lsearch{position:relative}
.lsearch input{padding-right:56px}
.lclear{all:unset;cursor:pointer;position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;line-height:1;color:var(--muted);border-radius:10px}
input[type=search]::-webkit-search-cancel-button{display:none}
.big .bn,.big .bs{display:block}
.grp{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px;padding-bottom:6px;border-bottom:3px solid var(--brand)}
.grp b{font:700 1.35rem var(--display)}
.grp>span{color:var(--muted);font-size:.9rem}
.stop{display:inline-block;min-width:1.7em;text-align:center;vertical-align:.15em;font:700 .85rem/1.5 var(--body);color:var(--on-brand);background:var(--brand);border-radius:999px;padding:2px 9px;margin-right:6px}
.ttl h1{font:700 1.55rem/1.1 var(--display);margin:0;letter-spacing:.01em;overflow-wrap:anywhere;text-wrap:balance}
.ttl p{margin:2px 0 0;font-size:.9rem;opacity:.9}

main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
h2.sec{font:700 1.2rem var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 0}
.hint{color:var(--muted);margin:0}
.banner{background:var(--orange-bg);color:var(--orange-fg);border-radius:12px;padding:12px 14px;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.big{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px}
.big:active{border-color:var(--brand)}
.big .bn{font:700 1.4rem/1.15 var(--display);overflow-wrap:anywhere}
.big .bs{color:var(--muted);font-size:.95rem;margin-top:2px}
.big .bc{font:700 2rem/1 var(--display);color:var(--brand);font-variant-numeric:tabular-nums;flex:0 0 auto}
.big.sm{min-height:66px;padding:12px 16px}
.big.sm .bn{font-size:1.2rem}
.big.sm .bc{font-size:1.5rem}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chip{all:unset;cursor:pointer;flex:0 0 auto;padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.card.hasdel{position:relative}
.card.hasdel .cmain{padding-right:52px}
.cdel{all:unset;cursor:pointer;position:absolute;top:6px;right:6px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted);opacity:.7;z-index:1}
.cdel:hover,.cdel:focus-visible{opacity:1;color:var(--brand)}
.cdel svg{width:20px;height:20px}
.cphone{padding:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.pnum{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 12px 6px 8px;margin-left:-8px;border-radius:10px;font:700 1.3rem var(--display);letter-spacing:.03em;font-variant-numeric:tabular-nums;color:var(--fg)}
.pnum svg{width:20px;height:20px;color:var(--brand)}
.pnum[aria-expanded="true"]{background:var(--bg)}
.pmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pmenu .btn{min-height:52px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.cmain{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cname{font:700 1.3rem/1.15 var(--display);overflow-wrap:anywhere}
.cinfo{color:var(--muted);font-size:.95rem;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:999px}
.st-pend{color:var(--s-pend);background:var(--s-pend-bg)} .st-vis{color:var(--s-vis);background:var(--s-vis-bg)}
.st-int{color:var(--s-int);background:var(--s-int-bg)} .st-ped{color:var(--s-ped);background:var(--s-ped-bg)}
.st-desc{color:var(--s-desc);background:var(--s-desc-bg)}
.tag.av{color:var(--orange-fg);background:var(--orange-bg)}
.tag.av.due{color:var(--on-brand);background:var(--brand)}
.card.desc .cname{color:var(--s-desc)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--line)}
.act{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;font-weight:700;font-size:.95rem;text-align:center;padding:6px}
.act+.act{border-left:2px solid var(--line)}
.act svg{width:24px;height:24px}
.act.call{color:var(--brand)} .act.wa{color:var(--wa)}
.act[aria-disabled="true"]{color:var(--muted);opacity:.55;cursor:default}

.btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:1.05rem;text-align:center;background:var(--surface);border:2px solid var(--line)}
.btn svg{width:24px;height:24px;flex:0 0 auto}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.pri:active{background:var(--brand-dk)}
.btn.call{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.btn.danger{color:var(--brand);border-color:var(--brand)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline;min-height:48px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fname{font:700 1.7rem/1.1 var(--display);margin:0;overflow-wrap:anywhere;text-wrap:balance}
.phone{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.phone .num{font:700 1.6rem var(--display);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.mail{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mail span{overflow-wrap:anywhere;min-width:0}
.copy{all:unset;cursor:pointer;font-weight:700;font-size:.95rem;padding:8px 14px;border-radius:10px;border:2px solid var(--line)}

.states{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sbtn{-webkit-appearance:none;appearance:none;font:inherit;font-size:1.05rem;cursor:pointer;padding:8px;text-align:center;min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-weight:700;border:3px solid transparent}
.sbtn[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 2px var(--surface)}
.sbtn[aria-pressed="true"]::before{content:"✓ "; white-space:pre}

.recnow{font-size:1.1rem;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label.lbl{display:flex;flex-direction:column;gap:6px;font-weight:700}
label.lbl small{font-weight:400;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=search],input[type=date],select,textarea{width:100%;min-height:56px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:1.1rem}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
.err{color:var(--brand);font-weight:700;margin:0}
.notes{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.notes li{border-left:4px solid var(--line);padding:4px 0 4px 12px}
.notes .nd{font-size:.88rem;color:var(--muted);font-weight:700}
.notes .nt{white-space:pre-wrap;overflow-wrap:anywhere}
.confirm{background:var(--orange-bg);color:var(--fg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px 10px;font-weight:700;font-size:.78rem;color:var(--muted);position:relative;min-height:62px;justify-content:center}
.tab svg{width:26px;height:26px}
.tab[aria-current="true"]{color:var(--brand)}
.tab.new .plus{width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center}
.tab.new .plus svg{width:28px;height:28px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:24px;height:24px;border-radius:12px;background:var(--orange);color:#1d1716;font-size:.85rem;display:flex;align-items:center;justify-content:center;padding:0 6px}
.badge[hidden],.toast[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}

/* notas, avisos, dictado y compras */
.toast{z-index:40}
.card.hasdel.hasnote .cmain{padding-right:100px}
.cnote{all:unset;cursor:pointer;position:absolute;top:6px;right:50px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--brand);background:var(--bg);z-index:1}
.cnote svg{width:22px;height:22px}
.cnote .dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--orange);color:#1d1716;font:700 .7rem/16px var(--body);text-align:center;padding:0 3px}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(20,12,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font:700 1.5rem/1.1 var(--display);margin:0;text-wrap:balance}
.sheet .who{color:var(--muted);margin:-8px 0 0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{all:unset;cursor:pointer;padding:10px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem}
.when{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.when .btn{min-height:54px;padding:8px;font-size:1rem}
.when .btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.mic{min-height:76px;font-size:1.2rem;background:var(--surface);color:var(--brand);border:3px solid var(--brand)}
.btn.mic svg{width:34px;height:34px}
.btn.mic.on{background:var(--brand);color:var(--on-brand);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(227,6,19,.45)}50%{box-shadow:0 0 0 10px rgba(227,6,19,0)}}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.sum b{font:700 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.sum span{color:var(--muted);font-size:.9rem;font-weight:700}
.sum.hot{border-color:var(--brand)} .sum.hot b{color:var(--brand)}
.ord{margin:-8px 0 0;color:var(--muted);font-size:.9rem;font-weight:700}
.av-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 0}
.av-top small{color:var(--muted);font-weight:700}
.anote{margin:0 16px;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:1.15rem;white-space:pre-wrap;overflow-wrap:anywhere}
.tag.nodate{color:var(--muted);background:var(--bg);border:2px solid var(--line)}
.acts.a4{grid-template-columns:repeat(4,1fr)}
.acts.a4 .act{font-size:.9rem;padding:6px 2px}
.act.done{color:var(--s-ped)}
.nedit{all:unset;cursor:pointer;font-weight:700;font-size:.95rem;color:var(--brand);padding:6px 0;text-decoration:underline}
.notes li.hasav{border-left-color:var(--orange)}
.notes li.isdone .nt{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .sl{color:var(--muted);font-size:.9rem;font-weight:700}
.stat .sv{font:700 1.7rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat .sx{font-size:.9rem;font-weight:700}
.stat.main{grid-column:1/-1}
.stat.main .sv{font-size:2.4rem;color:var(--brand)}
.up{color:var(--s-ped)} .down{color:var(--brand)}
.chart{display:flex;flex-direction:column;gap:6px}
.chart .ch,.och{font-weight:700;font-size:.95rem;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px;border-bottom:2px solid var(--line)}
.bars i{display:block;background:var(--s-pend-bg);border-radius:5px 5px 0 0;min-height:2px}
.bars i.on{background:var(--brand)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;text-align:center;font-size:.8rem;color:var(--muted);font-weight:700}
.orders{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.orders li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.orders li:first-child{border-top:0}
.orders .od{color:var(--muted);font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums}
.orders .oc{min-width:0;overflow-wrap:anywhere}
.orders .oi{font:700 1.15rem var(--display);font-variant-numeric:tabular-nums}
.orders .ox{all:unset;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted)}
.orders .ox svg{width:18px;height:18px}

/* pantalla de Ruta sin cabecera roja: más espacio en el móvil */
body.nohead .top{display:none}
body.nohead main{padding-top:calc(16px + env(safe-area-inset-top,0px))}
/* rutas guardadas */
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rrow{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:10px}
.rrow .stop{margin:0;flex:0 0 auto}
.rn{flex:1;min-width:0;display:flex;flex-direction:column}
.rn b{font:700 1.15rem/1.15 var(--display);overflow-wrap:anywhere}
.rn small{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.rctl{display:flex;gap:4px;flex:0 0 auto}
.ib{all:unset;cursor:pointer;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:2px solid var(--line);color:var(--fg)}
.ib svg{width:20px;height:20px}
.ib[disabled]{opacity:.3;cursor:default}
.ib.x{color:var(--brand)}
.addb{all:unset;cursor:pointer;flex:0 0 auto;padding:10px 14px;border-radius:12px;font-weight:700;font-size:.95rem;border:2px solid var(--brand);color:var(--brand);white-space:nowrap}
.addb[aria-pressed="true"]{background:var(--s-ped-bg);color:var(--s-ped);border-color:var(--s-ped)}
.rstop{font-weight:700;color:var(--muted);font-size:.95rem;margin:6px 0 -6px;display:flex;align-items:center;gap:4px}
.savebar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:8px;padding:10px 0 0;background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.rapl{flex-wrap:wrap;align-items:flex-start}
.rapl .rn{flex:1 1 calc(100% - 50px);gap:6px}
.rapl .rctl{width:100%;justify-content:flex-end}
input.rin{min-height:48px;padding:8px 12px;font-size:1rem}
.pills .pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* pantalla de entrada: solo fondo rojo y los campos */
body.login{background:var(--brand)}
body.login .top{display:none}

/* distancia aproximada por carretera: línea recta x 1,3 */
function km(a,b){ const A=GEO[a],B=GEO[b]; if(!A||!B) return null; const r=Math.PI/180, dLa=(B[0]-A[0])*r, dLo=(B[1]-A[1])*r;
  const h=Math.sin(dLa/2)**2+Math.cos(A[0]*r)*Math.cos(B[0]*r)*Math.sin(dLo/2)**2; return 6371*2*Math.asin(Math.sqrt(h))*1.3; }
/* orden de visita: siempre al pueblo más cercano que quede por visitar */
function routeOrder(pueblos){
  let left=pueblos.filter(p=>GEO[p]), out=[], at=DB.start;
  while(left.length){ left.sort((a,b)=>km(at,a)-km(at,b)); const n=left.shift(); out.push({p:n,km:km(at,n),from:at}); at=n; }
  pueblos.filter(p=>!GEO[p]).sort((a,b)=>a.localeCompare(b,"es")).forEach(p=>out.push({p,km:null}));
  return out;
}

const rowOf = c => ({id:c.id, codigo:c.c||"", nombre:c.n, contacto:c.r||"", telefono:c.t||"", email:c.e||"", pueblo:c.p||"",

/* compara lo que hay en pantalla con lo último guardado en la nube */
function diff(){
  const curC={}, curN={}, curO={};
  DB.clients.forEach(c=>{ c.notes.forEach(n=>{ if(!n.id) n.id=uuid(); if(!n.cr) n.cr=new Date().toISOString(); }); c.ord=c.ord||[];
    curC[c.id]=JSON.stringify(rowOf(c)); c.notes.forEach(n=>curN[n.id]=JSON.stringify(noteRow(c,n))); c.ord.forEach(o=>curO[o.id]=JSON.stringify(ordRow(c,o))); });
  const upC=Object.keys(curC).filter(id=>SYNCED.clients[id]!==curC[id]);
  const delC=Object.keys(SYNCED.clients).filter(id=>!(id in curC));
  const upN=Object.keys(curN).filter(id=>SYNCED.notes[id]!==curN[id]);
  const delN=Object.keys(SYNCED.notes).filter(id=>!(id in curN) && (JSON.parse(SYNCED.notes[id]).cliente_id in curC));
  const upO=Object.keys(curO).filter(id=>SYNCED.orders[id]!==curO[id]);
  const delO=Object.keys(SYNCED.orders).filter(id=>!(id in curO) && (JSON.parse(SYNCED.orders[id]).cliente_id in curC));
  const start = READY && SYNCED.start!==DB.start;
  return {curC, curN, curO, upC, delC, upN, delN, upO, delO, start, n:upC.length+delC.length+upN.length+delN.length+upO.length+delO.length+(start?1:0)};
}

let flushing=false, flushAgain=false;

    const chunks=(a,n=500)=>{ const r=[]; for(let i=0;i<a.length;i+=n) r.push(a.slice(i,i+n)); return r; };
    for(const ids of chunks(d.upC)){ const {error}=await sb.from("clientes").upsert(ids.map(id=>JSON.parse(d.curC[id]))); if(error) throw error; ids.forEach(id=>SYNCED.clients[id]=d.curC[id]); }
    for(const ids of chunks(d.upN)){ const {error}=await sb.from("notas").upsert(ids.map(id=>JSON.parse(d.curN[id]))); if(error) throw error; ids.forEach(id=>SYNCED.notes[id]=d.curN[id]); }
    for(const ids of chunks(d.upO)){ const {error}=await sb.from("pedidos").upsert(ids.map(id=>JSON.parse(d.curO[id]))); if(error) throw error; ids.forEach(id=>SYNCED.orders[id]=d.curO[id]); }
    for(const ids of chunks(d.delO,200)){ const {error}=await sb.from("pedidos").delete().in("id",ids); if(error) throw error; ids.forEach(id=>delete SYNCED.orders[id]); }
    for(const ids of chunks(d.delN,200)){ const {error}=await sb.from("notas").delete().in("id",ids); if(error) throw error; ids.forEach(id=>delete SYNCED.notes[id]); }
    for(const ids of chunks(d.delC,200)){ const {error}=await sb.from("clientes").delete().in("id",ids); if(error) throw error;
      ids.forEach(id=>delete SYNCED.clients[id]);
      Object.keys(SYNCED.notes).forEach(nid=>{ if(ids.includes(JSON.parse(SYNCED.notes[nid]).cliente_id)) delete SYNCED.notes[nid]; });
      Object.keys(SYNCED.orders).forEach(oid=>{ if(ids.includes(JSON.parse(SYNCED.orders[oid]).cliente_id)) delete SYNCED.orders[oid]; }); }
    if(d.start){ const {error}=await sb.from("ajustes").upsert({clave:"salida", valor:DB.start}); if(error) throw error; SYNCED.start=DB.start; }
    cacheLocal(); setSync("ok");
  }catch(err){
    cacheLocal(); setSync("off"); console.warn("sync", err);
    if(err && /JWT|auth|401/i.test(String(err.message||err.code||""))) { const {data}=await sb.auth.getSession(); if(!data.session) return logoutLocal(); }
    retryTimer=setTimeout(flush, 20000);
  }finally{
    flushing=false; if(flushAgain){ flushAgain=false; flush(); }
  }
}

async function fetchAll(table, order){
  const out=[]; for(let from=0;;from+=1000){
    const {data,error}=await sb.from(table).select("*").order(order).range(from, from+999);
    if(error) throw error; out.push(...data); if(data.length<1000) return out; }
}
/* trae lo último de la nube (si no hay cambios propios sin subir) */
async function pull(){
  if(!sb || !session) return;
  await flush(); if(pending()) return;
  let cs, ns, as, os;
  try{ [cs, ns, as, os]=await Promise.all([fetchAll("clientes","id"), fetchAll("notas","creado"), fetchAll("ajustes","clave"), fetchAll("pedidos","fecha")]); }
  catch(err){ setSync("off"); console.warn("pull", err); return; }
  setSync("ok");
  if(pending()) return; /* ha cambiado algo mientras descargábamos */
  const byC={}; ns.forEach(n=>(byC[n.cliente_id]=byC[n.cliente_id]||[]).push({id:n.id, d:n.fecha||"", t:n.texto, av:n.aviso||"", p:!!n.pendiente, cr:n.creado}));
  const byO={}; os.forEach(o=>(byO[o.cliente_id]=byO[o.cliente_id]||[]).push({id:o.id, d:o.fecha, imp:Number(o.importe)||0, con:o.concepto||""}));
  DB.clients=cs.map(r=>({id:r.id, c:r.codigo, n:r.nombre, r:r.contacto, t:r.telefono, e:r.email, p:r.pueblo, z:r.zona, st:r.estado, rec:r.volver_llamar||"", notes:byC[r.id]||[], ord:byO[r.id]||[]}));
  const sal=as.find(a=>a.clave==="salida"); DB.start = sal && GEO[sal.valor] ? sal.valor : (DB.start||"PINEDA DE MAR");
  SYNCED={clients:{}, notes:{}, orders:{}, start: sal?sal.valor:null};
  DB.dirty=DB.dirty||{}; if(DB.rutasDirty){ DB.dirty.rutas=true; delete DB.rutasDirty; }
  JK.forEach(k=>{ const ru=as.find(a=>a.clave===k); if(!ru) return; SYNCED[k]=typeof ru.valor==="string"?ru.valor:JSON.stringify(ru.valor);
    if(!DB.dirty[k]){ try{ const v=typeof ru.valor==="string"?JSON.parse(ru.valor):ru.valor; if(v!=null) DB[k]=v; }catch(e){} } });
  DB.rutas=DB.rutas||[]; DB.rapports=DB.rapports||[]; if(JK.some(k=>DB.dirty[k])) pushRutas();
  DB.clients.forEach(c=>{ SYNCED.clients[c.id]=JSON.stringify(rowOf(c)); c.notes.forEach(n=>SYNCED.notes[n.id]=JSON.stringify(noteRow(c,n))); c.ord.forEach(o=>SYNCED.orders[o.id]=JSON.stringify(ordRow(c,o))); });
  /* los antiguos «Volver a llamar» pasan a ser notas con aviso */
  let moved=0; DB.clients.forEach(c=>{ if(c.rec){ c.notes.push(newNote("Volver a llamar", c.rec)); c.rec=""; moved++; } });
  if(moved) save(); else cacheLocal();
  const first=!READY; READY=true;
  if(first) render(true);
  else if(!["form"].includes(cur().v) && !document.activeElement?.matches?.("input,textarea,select")) render();
}

/* hoja A4 igual que la plantilla de la empresa */
function rapPdf(r){
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}), P=perfil();
  const L=15, R=195, X=[15,67,100,195], top=18, bottom=278;
  const txt=(t,x,y,size,o)=>{ doc.setFont("helvetica","normal"); doc.setFontSize(size); doc.text(t,x,y,o); };
  txt("RAPPORT visitas", L, top+6, 20);
  txt(String(P.nombre).toUpperCase(), 100, top+6, 13);
  txt(fmtYY(r.fecha), R, top+15, 13, {align:"right"});
  txt("MATRICULA:", L, top+24, 10); txt(String(P.matricula), L+25, top+24, 10);
  doc.setLineWidth(.3); doc.rect(100, top+18, R-100, 8); txt(`KILOMETROS  ${r.kmIni===""?"":r.kmIni}`, 102, top+24, 13);
  let y=top+32;
  const head=()=>{ doc.setLineWidth(.5); doc.rect(L,y,R-L,6); doc.line(X[1],y,X[1],y+6); doc.line(X[2],y,X[2],y+6);
    txt("CLIENTE",X[0]+1.5,y+4.3,8.5); txt("POBLACION",X[1]+1.5,y+4.3,8.5); txt("MOTIVO DE LA VISITA  / OBSERVACIONES",X[2]+1.5,y+4.3,8.5); y+=6; doc.setLineWidth(.3); };
  head();
  doc.setFontSize(11);
  const rows=r.lineas.map(l=>{ const a=doc.splitTextToSize(l.n||"",X[1]-X[0]-3), b=doc.splitTextToSize(l.p||"",X[2]-X[1]-3), c=doc.splitTextToSize(l.m||"",X[3]-X[2]-3);
    return {a,b,c,h:Math.max(11, Math.max(a.length,b.length,c.length)*4.6+6)}; });
  const n=Math.max(rows.length,15);
  for(let i=0;i<n;i++){ const row=rows[i]||{a:[],b:[],c:[],h:11};
    if(y+row.h>bottom){ if(!rows[i]) break; doc.addPage(); y=top; head(); }
    doc.rect(L,y,R-L,row.h); doc.line(X[1],y,X[1],y+row.h); doc.line(X[2],y,X[2],y+row.h);
    doc.setFont("helvetica","normal"); doc.setFontSize(11);
    if(row.a.length) doc.text(row.a,X[0]+1.5,y+6.5); if(row.b.length) doc.text(row.b,X[1]+1.5,y+6.5); if(row.c.length) doc.text(row.c,X[2]+1.5,y+6.5);
    y+=row.h; }
  if(y+18>290){ doc.addPage(); y=top; }
  doc.rect(100,y+8,R-100,8); txt(`KILOMETROS : ${r.kmFin===""?"":r.kmFin}`,102,y+14,13);
  return doc.output("arraybuffer");
}
async function rapDownload(){

}

/* ---------- dictado por voz ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let mic={on:false, rec:null, base:""};
const joinTxt=(a,b)=>{ b=b.trim(); if(!b) return a; const s=a.trim()?a.replace(/\s+$/,"")+" "+b:b; return s[0].toUpperCase()+s.slice(1); };
function micKill(){ mic.on=false; const r=mic.rec; mic.rec=null; try{ r&&r.abort(); }catch(e){} }
function micStop(){ const ta=$("ntxt"); if(ta&&sheet) sheet.txt=ta.value; mic.on=false; const r=mic.rec; mic.rec=null; try{ r&&r.stop(); }catch(e){} renderSheet(); }
function micStart(){
  if(!SR) return toast("Este aparato no permite dictar. Usa el micrófono del teclado.");
  sheet.txt=mic.base=$("ntxt").value; mic.on=true; renderSheet();
  try{
    const r=new SR(); r.lang="es-ES"; r.continuous=true; r.interimResults=true;
    r.onresult=ev=>{ let t=""; for(let i=0;i<ev.results.length;i++) t+=ev.results[i][0].transcript; const ta=$("ntxt"); if(ta){ ta.value=joinTxt(mic.base,t); ta.scrollTop=1e9; } };
    r.onerror=ev=>{ if(mic.rec!==r) return; if(ev.error==="not-allowed"||ev.error==="service-not-allowed") toast("Hay que dar permiso al micrófono para poder dictar"); else if(ev.error==="no-speech") toast("No te he oído. Toca el micrófono y habla"); };
    r.onend=()=>{ if(mic.rec===r) micStop(); };
    mic.rec=r; r.start();
  }catch(e){ mic.on=false; mic.rec=null; renderSheet(); toast("No se ha podido usar el micrófono"); }
}
function renderSheet(){ $("sheet").innerHTML=sheetHtml(); document.body.style.overflow=sheet?"hidden":""; }
function keepSheet(){ const ta=$("ntxt"); if(ta) sheet.txt=ta.value; const nd=$("ndate"); if(nd) sheet.date=nd.value; }
$("sheet").onclick=e=>{
  const sc=e.target.closest(".scrim"); if(sc && e.target===sc){ micKill(); sheet=null; return renderSheet(); }
  const b=e.target.closest("button"); if(!b||!sheet) return;
  const d=b.dataset, c=byId(sheet.id);
  if(d.mic!==undefined) return mic.on?micStop():micStart();
  if(mic.on) micStop();
  if(d.cancel!==undefined){ sheet=null; return renderSheet(); }
  if(d.preset){ const ta=$("ntxt"); ta.value=d.preset+(ta.value.trim()?" · "+ta.value.trim():" "); ta.focus(); return; }
  if(d.when){ keepSheet(); sheet.when=d.when; return renderSheet(); }
  if(d.ndel!==undefined||d.ndelno!==undefined){ keepSheet(); sheet.confirmDel=d.ndel!==undefined; return renderSheet(); }
  if(d.ndelyes!==undefined){ c.notes=c.notes.filter(x=>x.id!==sheet.nid); sheet=null; save(); render(); return toast("Nota borrada"); }
  if(d.savenote!==undefined){
    const t=($("ntxt").value||"").trim(); if(!t){ $("ntxt").focus(); return toast("Escribe algo en la nota"); }
    const w=sheet.when, av = w==="no" ? "" : w==="x" ? (($("ndate")||{}).value||"") : addDays(+w);
    if(w==="x" && !av) return toast("Elige la fecha del aviso");
    if(sheet.nid){ const n=c.notes.find(x=>x.id===sheet.nid); if(n){ n.t=t; n.av=av; n.p=true; } sheet=null; save(); render(); return toast("Nota cambiada"); }
    c.notes.push(newNote(t,av)); sheet=null; save(); render();
    return toast(av ? "Nota guardada. Te avisará "+(av===today()?"hoy":av===addDays(1)?"mañana":"el "+fmtShort(av)) : "Nota guardada en Avisos");
  }
  if(d.saveord!==undefined){
    const raw=($("oimp").value||"").trim().replace(/[€\s]/g,""), imp=parseFloat(raw.includes(",")?raw.replace(/\./g,"").replace(",","."):raw);
    if(!(imp>0)){ $("oerr").hidden=false; $("oimp").focus(); return; }
    c.ord=c.ord||[]; c.ord.push({id:uuid(), d:$("odate").value||today(), imp:Math.round(imp*100)/100, con:$("ocon").value.trim()});
    sheet=null; save(); render(); return toast("Pedido de "+eur(imp)+" apuntado");
  }
};
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && sheet){ micKill(); sheet=null; renderSheet(); } });

  if(d.editnote){ const [cid,nid]=d.editnote.split("|"), x=byId(cid), n=x&&x.notes.find(y=>y.id===nid); if(!n) return;
    sheet={type:"note", id:cid, nid, txt:n.t, when:n.av?"x":"no", date:n.av||""}; return renderSheet(); }
  if(d.ndone){ const [cid,nid]=d.ndone.split("|"), x=byId(cid), n=x&&x.notes.find(y=>y.id===nid); if(n){ n.p=false; save(); render(); } return toast("Hecho. La nota se queda en la ficha"); }
  if(d.addord){ sheet={type:"ord", id:d.addord}; renderSheet(); setTimeout(()=>$("oimp")?.focus(),50); return; }
  if(d.delord){ ui.delOrd=d.delord; return render(); }
  if(b.hasAttribute("data-delordno")){ ui.delOrd=null; return render(); }
  if(b.hasAttribute("data-delordyes") && c){ c.ord=c.ord.filter(o=>o.id!==ui.delOrd); ui.delOrd=null; save(); render(); return toast("Pedido borrado"); }
  if(b.hasAttribute("data-allord")){ ui.allOrd=!ui.allOrd; return render(); }
  if(d.edit) return go({v:"form",id:d.edit});
  if(b.hasAttribute("data-del")){ ui.del=true; return render(); }
  if(d.pmenu){ ui.pmenu = ui.pmenu===d.pmenu ? null : d.pmenu; return render(); }
  if(d.cdel){ ui.delCard=d.cdel; return render(); }
  if(b.hasAttribute("data-cdelno")){ ui.delCard=null; return render(); }
  if(d.cdelyes){ const x=byId(d.cdelyes); DB.clients=DB.clients.filter(y=>y.id!==d.cdelyes); ui.delCard=null; save(); render(); return toast((x?x.n:"Cliente")+" eliminado"); }
  if(b.hasAttribute("data-delno")){ ui.del=false; return render(); }
  if(b.hasAttribute("data-delyes") && c){ DB.clients=DB.clients.filter(x=>x.id!==c.id); save(); stack.pop(); ui={}; render(true); return toast("Cliente eliminado"); }
  if(b.hasAttribute("data-back")) return back();
  if(b.hasAttribute("data-fsave")) return saveForm(view.id);
  if(b.hasAttribute("data-export")) return exportXlsx();
  if(b.hasAttribute("data-import")){ $("file").value=""; return $("file").click(); }
  if(b.hasAttribute("data-impno")){ ui.imp=null; return render(); }
  if(b.hasAttribute("data-impyes")){ DB.clients=ui.imp; save(); ui={}; render(true); return toast("Clientes cargados"); }
};

function saveForm(id){
  const n=$("f-n").value.trim();
  if(!n){ $("f-err").hidden=false; $("f-n").focus(); return; }
  const p=$("f-p").value.trim().toUpperCase();
  const data={n, r:$("f-r").value.trim(), t:$("f-t").value.trim(), e:$("f-e").value.trim(), p, z:$("f-z").value||PZ[p]||"Fuera de zona", c:$("f-c").value.trim()};
  if(id){ Object.assign(byId(id),data); save(); stack.pop(); render(true); toast("Datos corregidos"); }
  else { const nc={id:"n"+Date.now(), ...data, st:"pend", rec:"", notes:[], ord:[]}; DB.clients.push(nc); save(); tab="ruta"; stack=[{v:"zonas"},{v:"ficha",id:nc.id}]; ui={}; render(true); toast("Cliente añadido"); }
}

/* ---------- Excel ---------- */
let xlsxP=null;
function loadXLSX(){
  if(typeof XLSX!=="undefined") return Promise.resolve();
  if(!xlsxP) xlsxP=new Promise((res,rej)=>{ const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=res; s.onerror=()=>{xlsxP=null;rej();}; document.head.appendChild(s); });
  return xlsxP;
}
let dl=null;
try{ window.claude?.use?.("downloads")?.then(x=>{dl=x;}).catch(()=>{}); }catch(e){}
async function saveFile(filename, bytes){
  if(dl) return dl.save({filename, data:bytes});
  if(window.claude) throw {code:"unavailable"};
  const type=/\.pdf$/i.test(filename)?"application/pdf":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  /* iPhone / iPad: se abre el menú de compartir (Guardar en Archivos, Imprimir, WhatsApp…) */
  if(/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare){ const f=new File([bytes],filename,{type});
    if(navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f], title:filename}); return; }catch(err){ if(err&&err.name==="AbortError") throw err; } } }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([bytes],{type}));
  a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000);
}
async function exportXlsx(){
  toast("Preparando el Excel…");
  try{ await loadXLSX(); }catch(e){ return toast("Sin conexión: no se ha podido preparar el Excel"); }
  const rows=DB.clients.map(c=>({"ID":c.id,"Código":c.c,"Nombre":c.n,"Contacto":c.r,"Teléfono":c.t,"Email":c.e,"Pueblo":title(c.p),"Zona":c.z,"Estado":EST[c.st],
    "Total pedidos":(c.ord||[]).reduce((s,o)=>s+o.imp,0),"Notas":[...c.notes].sort((a,b)=>(b.d||"").localeCompare(a.d||"")).map(n=>(n.d?fmtShort(n.d):"Papel")+": "+n.t).join("\n")}));
  const notes=[]; DB.clients.forEach(c=>c.notes.forEach(n=>notes.push({"ID":c.id,"Cliente":c.n,"Fecha":n.d?fmtShort(n.d):"Papel","Nota":n.t,"Aviso":n.av?fmtShort(n.av):"","En avisos":n.p?"Sí":"No"})));
  const peds=[]; DB.clients.forEach(c=>(c.ord||[]).forEach(o=>peds.push({"ID":c.id,"Cliente":c.n,"Fecha":fmtShort(o.d),"Importe":o.imp,"Concepto":o.con})));
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.json_to_sheet(rows); ws["!cols"]=[{wch:8},{wch:12},{wch:34},{wch:28},{wch:16},{wch:30},{wch:24},{wch:18},{wch:12},{wch:14},{wch:60}];
  const wn=XLSX.utils.json_to_sheet(notes.length?notes:[{"ID":"","Cliente":"","Fecha":"","Nota":""}]); wn["!cols"]=[{wch:8},{wch:34},{wch:12},{wch:70}];
  XLSX.utils.book_append_sheet(wb,ws,"Clientes"); XLSX.utils.book_append_sheet(wb,wn,"Notas");
  const wp=XLSX.utils.json_to_sheet(peds.length?peds:[{"ID":"","Cliente":"","Fecha":"","Importe":"","Concepto":""}]); wp["!cols"]=[{wch:8},{wch:34},{wch:12},{wch:12},{wch:50}];
  XLSX.utils.book_append_sheet(wb,wp,"Pedidos");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const t=today().split("-");
  try{ await saveFile(`Clientes Interlama ${t[2]}-${t[1]}-${t[0]}.xlsx`, new Uint8Array(buf));
    DB.lastExport=today(); save(); render(); toast("Excel descargado"); }
  catch(err){ toast(err&&err.code==="declined"?"Descarga cancelada":"No se pudo descargar el Excel"); }
}
const toIso = s => { const m=String(s||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:""; };
$("file").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    await loadXLSX();
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const cs=XLSX.utils.sheet_to_json(wb.Sheets["Clientes"]||wb.Sheets[wb.SheetNames[0]],{defval:"",raw:false});
    const ns=wb.Sheets["Notas"]?XLSX.utils.sheet_to_json(wb.Sheets["Notas"],{defval:"",raw:false}):[];
    const ps=wb.Sheets["Pedidos"]?XLSX.utils.sheet_to_json(wb.Sheets["Pedidos"],{defval:"",raw:false}):null;
    const num=v=>{ const r=String(v).replace(/[€\s]/g,""); return parseFloat(r.includes(",")?r.replace(/\./g,"").replace(",","."):r)||0; };
    const inv=Object.fromEntries(ORDER.map(k=>[EST[k].toLowerCase(),k]));
    const out=cs.filter(r=>String(r["Nombre"]).trim()).map((r,i)=>{ const p=String(r["Pueblo"]).trim().toUpperCase(), id=String(r["ID"]||"i"+i);
      return {id, c:String(r["Código"]), n:String(r["Nombre"]).trim(), r:String(r["Contacto"]), t:String(r["Teléfono"]), e:String(r["Email"]), p,
        z:ZONAS.includes(r["Zona"])?r["Zona"]:(PZ[p]||"Fuera de zona"), st:inv[String(r["Estado"]).toLowerCase()]||"pend", rec:toIso(r["Volver a llamar"]),
        notes:ns.filter(n=>String(n["ID"])===id && String(n["Nota"]).trim()).map(n=>({d:toIso(n["Fecha"]),t:String(n["Nota"]),av:toIso(n["Aviso"]),p:String(n["En avisos"]).toLowerCase()==="sí"})),
        ord: ps ? ps.filter(o=>String(o["ID"])===id && num(o["Importe"])>0).map(o=>({id:uuid(), d:toIso(o["Fecha"])||today(), imp:num(o["Importe"]), con:String(o["Concepto"]||"")})) : ((byId(id)||{}).ord||[])}; });
    if(!out.length) return toast("Ese Excel no tiene clientes");
    ui.imp=out; ui.impName=f.name; render();
  }catch(err){ toast("No se ha podido leer ese archivo"); }
};

/* usuario + PIN: el usuario se convierte en email interno y el PIN en contraseña */
const USER_DOMAIN="@interlama-crm.app", PIN_PREFIX="Interlama-";
/* ---------- entrar / cargando / cuenta ---------- */
V.login = () => ({t:"", s:"", h:`
  <form id="loginf" class="lform" novalidate>
    <input type="text" id="l-e" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Usuario" aria-label="Usuario">
    <input type="password" id="l-p" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" placeholder="PIN" aria-label="PIN" class="pin">
    <p class="lerr" id="l-err" role="alert" hidden></p>
    <button class="lbtn" type="submit" id="l-btn">Entrar</button>
  </form>`});
V.cargando = () => ({t:"Clientes Interlama", s:"", h:`<p class="empty">Cargando tus clientes…</p>${(!sb||syncState==="off")?`<p class="banner">No hay conexión a internet. En cuanto vuelva, se cargarán tus clientes.</p><button class="btn" onclick="location.reload()">Reintentar</button>`:""}`});
function accountBox(){
  const n=pending();
  let h=`<h2 class="sec">Cuenta</h2><section class="box"><p class="hint">Has entrado como <strong>${esc((session?.user?.email||"").replace(USER_DOMAIN,""))}</strong>. Todo se guarda en la nube y se ve igual en el móvil y en la tablet.</p>`;
  if(n) h+=`<p class="banner">Hay ${n} cambio${n>1?"s":""} esperando conexión para subirse.</p>`;
  h+= ui.out ? `<div class="confirm"><strong>¿Cerrar sesión en este aparato?</strong>${n?`<span>Los cambios que no se han subido se perderán.</span>`:`<span>Para volver a entrar necesitarás el usuario y el PIN.</span>`}<div class="row2"><button class="btn" data-outno>Cancelar</button><button class="btn pri" data-outyes>Sí, salir</button></div></div>`
             : `<button class="btn quiet" data-out>Cerrar sesión</button>`;
  return h+`</section>`;
}
$("v").addEventListener("input", e=>{ const t=e.target; if(rap && t.dataset && t.dataset.lf && rap.lineas[+t.dataset.li]) rap.lineas[+t.dataset.li][t.dataset.lf]=t.value; });
$("v").addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.hasAttribute("data-out")){ ui.out=true; render(); }
  else if(b.hasAttribute("data-outno")){ ui.out=false; render(); }
  else if(b.hasAttribute("data-outyes")){ try{ await sb.auth.signOut({scope:"local"}); }catch(err){} logoutLocal(); }
});
function bindLogin(){
  const f=$("loginf"); if(!f) return;
  f.onsubmit=async e=>{ e.preventDefault();
    const user=$("l-e").value.trim().toLowerCase(), pin=$("l-p").value.trim(), err=$("l-err"), btn=$("l-btn");
    const show=m=>{ err.textContent=m; err.hidden=false; };
    if(!user||!pin) return show("Escribe el usuario y el PIN.");
    const email = user.includes("@") ? user : user+USER_DOMAIN, pass = PIN_PREFIX+pin;
    if(!sb) return show("No hay conexión a internet. Prueba otra vez en un momento.");
    btn.disabled=true; btn.textContent="Entrando…";
    const {error}=await sb.auth.signInWithPassword({email, password:pass});
    btn.disabled=false; btn.textContent="Entrar";
    if(error) return show(/invalid/i.test(error.message)?"El usuario o el PIN no son correctos.":"No se ha podido entrar. Revisa la conexión y prueba otra vez.");
  };
  const p=$("l-p"); p.oninput=()=>{ p.value=p.value.replace(/\D/g,""); if(p.value.length===4 && $("l-e").value.trim()) f.requestSubmit(); };
}

/* ---------- arranque ---------- */
async function boot(){
  if(window.supabase?.createClient) sb=window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"interlama-auth"}});
  if(sb){
    const {data}=await sb.auth.getSession(); session=data.session;
    sb.auth.onAuthStateChange((ev, s)=>{
      const was=session; session=s;
      if(ev==="SIGNED_IN" && !was){ READY=loadCache(s.user.id); render(true); pull(); }
      if(ev==="SIGNED_OUT" && was) logoutLocal();
    });
  } else {
    /* sin conexión al abrir: si ya había sesión, enseñamos lo guardado */
    try{ const s=JSON.parse(localStorage.getItem("interlama-auth")||"null"); if(s&&s.user) session=s; }catch(e){}
  }
  if(session){ READY=loadCache(session.user.id); }
  render(true);
  if(session) pull();
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") pull(); });
  window.addEventListener("online", ()=>pull());
}
try{ boot(); }
catch(err){
  $("v").innerHTML=`<p class="banner">Algo ha fallado al abrir la app.</p><p class="hint">Tus datos están guardados en la nube. Prueba a recargar la página.</p><button class="btn pri" onclick="location.reload()">Recargar</button>`;
}
